  detail: >-
    The Enterprise API Gateway uses Azure API Management subscription keys issued after a manual
    authorisation process, and its API catalogue is not visible before sign-in, so no scope names
    are publicly readable. The UNSWorks DSpace REST API and OAI-PMH endpoint are anonymous-read
    and define no scopes. The only OAuth 2.0 surface found is the LTI 1.3 token endpoint on the
    tenant-operated Moodle host, whose scopes are defined by the 1EdTech LTI Advantage
    specification and by Moodle, not by UNSW.
