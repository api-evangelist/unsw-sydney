- date: '2026-08-19'
  rating: 3
  pipeline: university
  summary: 'University-pipeline re-profile. Operator attribution settled for every surface before anything
    was saved: four institution-operated (UNSWorks DSpace REST, UNSWorks OAI-PMH, the UNSW Shibboleth
    IdP, the gated Enterprise Developer Portal) and five tenant (Moodle/Open LMS LTI 1.3, Ex Libris Primo
    discovery, DevSoc Freerooms, plus the two archived student-society APIs). No vendor contract was saved
    under this slug. Two genuinely new surface classes were found that the June 2026 profile missed entirely:
    identity federation (aaf.unsw.edu.au/idp/shibboleth, SAML 2.0 metadata registered in the Australian
    Access Federation) and a conformant LTI 1.3 platform. Two corrections: the DevSoc timetable-scraper
    and CSESoc handbook-api were both archived by their owners in April 2026 and are no longer live surfaces;
    the GitHub organization pointer was moved off the student society to UNSW''s own unsw-edu-au org.
    Confirmed education-regime domain standards: oai-pmh, saml, shibboleth (institution) and lti (tenant).
    ORCID is registered in the UNSWorks metadata registry but not evidenced as populated and is recorded
    as not_evidenced. Two OpenAPIs were derived from live probes only; UNSW publishes none of its own.
    Coverage state: gated.'
  endpoints:
