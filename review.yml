reviews:
- date: '2026-06-03'
  rating: 3
  summary: UNSW operates an official Enterprise Developer Portal on Azure API Management (apideveloper.unsw.edu.au),
    but it is gated — onboarding is request-based and no public API endpoints or base URLs are disclosed,
    so enterprise APIs could not be exercised. Publicly verified live surfaces are the UNSWorks DSpace
    7.0 repository REST API (/server/api returns JSON) and its OAI-PMH endpoint (Identify verb confirmed).
    Course/timetable/handbook programmatic access exists only via community-maintained (DevSoc, CSESoc)
    GitHub projects, not official UNSW APIs. No endpoints were fabricated; only URLs returning verified
    responses are cataloged.
  endpoints:
