---
aid: unsw-sydney
name: University of New South Wales
description: >-
  The University of New South Wales (UNSW Sydney) is a public research
  university in Sydney, Australia, ranked #35 in the QS World University
  Rankings 2025. UNSW operates a gated Enterprise Developer Portal built on
  Microsoft Azure API Management at apideveloper.unsw.edu.au, exposing internal
  enterprise APIs for student-data and campus-services integration to authorised
  developers via a request-based onboarding process. Publicly accessible
  programmatic surfaces include the UNSWorks institutional repository (DSpace
  7.0) with a REST API and an OAI-PMH endpoint. Community-maintained APIs for
  the UNSW timetable and handbook are published by UNSW student societies
  (DevSoc and CSESoc) on GitHub.
type: Index
position: Consumer
access: 3rd-Party
image: https://kinlane-productions.s3.amazonaws.com/apis-json/apis-json-logo.jpg
url: https://raw.githubusercontent.com/api-evangelist/unsw-sydney/refs/heads/main/apis.yml
tags:
