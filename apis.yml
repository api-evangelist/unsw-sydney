aid: unsw-sydney
name: University of New South Wales
x-type: university
x-category: Public Research University
description: >-
  The University of New South Wales (UNSW Sydney) is a public research university in Sydney,
  Australia, and a member of the Group of Eight. Like almost every institution, UNSW is a
  federation of buyers rather than an API producer, and its programmable footprint has to be read
  that way. The one substantial platform UNSW runs itself — the Enterprise API Gateway and
  Developer Portal on Microsoft Azure API Management at apideveloper.unsw.edu.au — is completely
  gated: onboarding is request-based, the API catalogue is invisible before sign-in, no base URL is
  disclosed, and the portal states outright that consumers cannot exercise APIs in the portal. The
  surfaces a member of the public can actually read are three, and all three are institution-
  operated: the UNSWorks institutional repository REST API (DSpace 7.0, anonymous discovery search,
  authenticated item browse), its OAI-PMH 2.0 harvesting endpoint exposing twelve metadata formats
  back to 2007, and the UNSW Shibboleth identity provider whose SAML 2.0 entity metadata is
  published under the institution's own domain and registered in the Australian Access Federation.
  Everything else is a tenancy on someone else's platform — an Ex Libris Primo library discovery
  view, a vendor-hosted Moodle that is a conformant LTI 1.3 platform, a Microsoft Power Apps
  research-data toolkit — or student-society work on non-institution domains. UNSW publishes no
  OpenAPI, no open data portal, no status page, no changelog and no API governance ruleset.
