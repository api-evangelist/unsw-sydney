x-coverage:
  state: gated
  reason: gated_developer_portal
  generated: '2026-08-19'
  method: probed
  detail: >-
    UNSW's one substantial institution-operated API platform — the Enterprise API Gateway behind
    apideveloper.unsw.edu.au — cannot be read without authorisation, and authorisation is granted
    only through a manual request process that can require a data sharing agreement or a manager's
    approval. The catalogue path returns 404 unauthenticated, no gateway base URL is published
    anywhere on the portal, and the portal itself states that even authorised consumers cannot
    exercise APIs from within it. So the count, shape, versioning and lifecycle of UNSW's enterprise
    APIs are unknowable from outside, and this profile asserts nothing about them. What could be
    read was read completely: the UNSWorks DSpace REST API, its OAI-PMH endpoint and the UNSW
    Shibboleth IdP metadata were all probed live and are fully covered. Nothing here was blocked by
    bot protection, and the thinness of this profile is a fact about UNSW's publishing posture, not
    a gap in the sweep. UNSW operates no open data portal (data.unsw.edu.au redirects to an
    information-governance page), publishes no OpenAPI, no status page, no changelog and no
    security.txt, and its research-data toolkit sits behind a Microsoft tenant login.
  evidence:
